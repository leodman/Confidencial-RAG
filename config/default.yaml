system:
  name: Confidencial RAG
  mode: experimental

ui:
  provider: gradio
  share: true

storage:
  provider: local
  workspace: /content/confidencial_rag
  encrypted_backups: true

metadata:
  provider: sqlite

chunking:
  strategy: structure_aware
  chunk_size: 800
  overlap: 120

embeddings:
  provider: sentence_transformers
  model: sentence-transformers/all-MiniLM-L6-v2

vector_store:
  provider: faiss

retrieval:
  strategy: similarity
  top_k: 6

privacy:
  enabled: true
  fail_closed: true
  reversible_tokens: true
  allow_external_raw_text: false
  show_sanitized_payload: true

llm:
  provider: mock
  local_guardian: false

logging:
  level: INFO
  include_raw_text: false
