runtime:
  confidential_mode: true
  log_raw_text: false
ingestion:
  max_files: 200
  max_file_bytes: 52428800
  max_total_bytes: 524288000
chunking:
  chunk_size: 1000
  chunk_overlap: 150
embeddings:
  provider: sentence_transformers
  model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
retrieval:
  top_k: 5
  minimum_similarity: 0.10
privacy:
  fail_closed: true
  restore_locally: true
  persist_vault: false
  external_raw_text_allowed: false
storage:
  provider: local
  allow_overwrite: false
  max_archive_files: 1000
  max_archive_uncompressed_bytes: 536870912
ui:
  share: false
  authentication_required: true
